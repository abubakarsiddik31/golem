<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Golem cairn head mark">
  <!-- ear pebbles -->
  <circle cx="106" cy="250" r="30" fill="#4B5566"/>
  <circle cx="406" cy="250" r="30" fill="#4B5566"/>
  <!-- stacked river stones flowing into each other -->
  <rect x="148" y="104" width="216" height="104" rx="52" fill="#6E798C"/>
  <rect x="116" y="184" width="280" height="124" rx="62" fill="#5B6678"/>
  <rect x="148" y="290" width="216" height="110" rx="55" fill="#4B5566"/>
  <!-- forehead inscription -->
  <path d="M 256 126 C 261 142 261 170 256 186" fill="none" stroke="#00ADD8" stroke-width="18" stroke-linecap="round"/>
  <!-- eyes -->
  <rect x="160" y="232" width="64" height="36" rx="18" fill="#00ADD8"/>
  <rect x="288" y="232" width="64" height="36" rx="18" fill="#00ADD8"/>
  <!-- mouth -->
