  <line x1="370" y1="36" x2="370" y2="220" stroke="#00ADD8" stroke-width="40" stroke-linecap="round"/>
  <circle cx="462" cy="152" r="10" fill="#00ADD8"/>
  <circle cx="518" cy="152" r="10" fill="#00ADD8"/>
