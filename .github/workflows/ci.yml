name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # The module has zero dependencies; there is nothing to cache.
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      # Every example must exit 0 with no credentials: keyed ones print
      # instructions and exit, scripted ones run their scenario.
      - name: Run the examples
        run: |
          status=0
          for dir in examples/*/; do
            name=$(basename "$dir")
            echo "::group::$name"
            go run "./$dir" || { echo "example $name failed"; status=1; }
            echo "::endgroup::"
          done
          exit $status
  # Static analysis beyond go vet: dead code, suspicious assignments, style.
  # Pinned so a new staticcheck release cannot turn main red on its own.
  staticcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # The module has zero dependencies; there is nothing to cache.
          cache: false
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2026.1
      - name: Staticcheck
        run: '"$(go env GOPATH)/bin/staticcheck" ./...'
  # The statement-coverage floor from scripts/coverage.sh. Examples are
  # excluded there: they are programs to run, not importable surface.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Statement coverage
        run: scripts/coverage.sh
  # The exported-API gate promised in docs/ROADMAP.md: compare a pull
  # request against its base branch and fail on any incompatible change.
  # Additive changes pass silently. Pull requests only: a push to main is
  # the merge of an already-checked pull request.
  api:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The base branch must be present for the worktree comparison.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install apidiff
        run: go install golang.org/x/exp/cmd/apidiff@v0.0.0-20261014143641-f0251eb4aa3e
      - name: Check exported API compatibility
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: 'PATH="$(go env GOPATH)/bin:$PATH" scripts/apidiff.sh "$BASE_REF"'
  # The race build roughly doubles test time; it gates main the same as
  # the plain build but stays a separate job so it can be read apart.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Test with the race detector
        run: go test -race ./...
  # Continuous bounded fuzzing of the message-JSON contract. Runs on main
  # pushes only: pull requests exercise the seed corpus through the Test
  # step above, and a crasher found here lands as a regression entry that
  # every later run replays.
  fuzz:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Fuzz the message-JSON contract
        run: go test ./model -run FuzzMessageJSONIsDurable -fuzz FuzzMessageJSONIsDurable -fuzztime 90s
