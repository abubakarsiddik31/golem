name: Docs

on:
  push:
    branches: [main]
    paths:
      - docs/guides/**
      - mkdocs.yml
      - requirements-docs.txt
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/guides/**
      - mkdocs.yml
      - requirements-docs.txt
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Pure build: every Pages-specific step lives in the gated deploy job
  # so this job passes on a private repository without Pages enabled.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install MkDocs Material
        run: pip install -r requirements-docs.txt
      - name: Build site (strict)
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  # Pages cannot publish from a private repository on a free plan, and
  # deployments from pull_request events are rejected by the Pages
  # environment; this job runs only on pushes to main and manual
  # dispatches once the repository is public and Pages is enabled with
  # "GitHub Actions" as the source (see docs/website.md). Pull requests
  # get the strict build only.
  deploy:
    if: github.event_name != 'pull_request' && github.repository_visibility == 'public'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
